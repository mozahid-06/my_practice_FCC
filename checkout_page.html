<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Checkout Page</title>
</head>

<body>
    <body>
  <h1>Checkout</h1>

  <section>
    <h2>Your Cart</h2>
    <figure>
      <img src="https://cdn.freecodecamp.org/curriculum/labs/cube.jpg" alt="Rubik's cube">
      <figcaption>Left-handed Rubik's cube</figcaption>
    </figure>
  </section>

  <section>
    <h2>Payment Information</h2>
    <form>
      <label for="card-name">Cardholder Name <span aria-hidden="true">*</span></label>
      <input id="card-name" type="text" name="card-name" required>

      <label for="card-number">Card Number <span aria-hidden="true">*</span></label>
      <input id="card-number" type="text" name="card-number" aria-describedby="card-number-help" required>

      <p id="card-number-help">Please enter your 16-digit card number without spaces or dashes.</p>
    </form>
  </section>
</body>
</body>

</html>
